name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Builds, verifies and upload artifacts for CV
  cv:
    runs-on: ubuntu-latest
    container: texlive/texlive:latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build CV from latex/cv/
        run: make -C latex/cv

      # Only answers "was a PDF produced?" - the cause of a failure is in the
      # build step's output. pdflatex ends its log with "Output written on
      # main.pdf" on success and "Fatal error occurred" on failure.
      - name: Verify CV
        working-directory: latex/cv
        run: |
          last=$(tail -n 10 main.log)
          if [ ! -s main.pdf ] \
            || ! printf '%s\n' "$last" | grep -q "^Output written on main.pdf" \
            || printf '%s\n' "$last" | grep -qi error; then
            echo "::error::The CV PDF was not produced"
            printf '%s\n' "$last"
            exit 1
          fi

      - name: Upload CV artifact
        uses: actions/upload-artifact@v4
        with:
          name: cv-pdf
          path: latex/cv/main.pdf
          retention-days: 1

  site:
    # Run even when the cv job failed, so a broken CV never blocks the site.
    runs-on: ubuntu-latest
    needs: cv
    if: ${{ !cancelled() }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build index.html and cv.html from partials/
        run: python3 build.py

      # Also gives the live site's URL, used as the CV fallback below.
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Download this run's CV
        if: needs.cv.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: cv-pdf
          path: ${{ runner.temp }}/cv

      # If CV job fails - fetch latest successful CV
      - name: Fetch the last good CV from the live site
        if: needs.cv.result != 'success'
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          url="${BASE_URL%/}/materials/CV_IvanGrigorik.pdf"
          echo "::warning::The cv job failed - deploying the live CV instead: $url"
          curl -fsSL --retry 3 --create-dirs -o "$RUNNER_TEMP/cv/main.pdf" "$url"

      - name: Publish CV as materials/CV_IvanGrigorik.pdf
        run: cp "$RUNNER_TEMP/cv/main.pdf" materials/CV_IvanGrigorik.pdf

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: site
    # Explicit: the default success() also looks at the cv job further up the
    # chain, which would skip deploying whenever the CV fell back.
    if: ${{ !cancelled() && needs.site.result == 'success' }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

